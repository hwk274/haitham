<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الموقع تحت الإنشاء</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
    overflow:hidden;
}

.container{
    text-align:center;
    color:#fff;
    padding:40px;
    max-width:700px;
}

.logo{
    width:120px;
    height:120px;
    margin:auto;
    margin-bottom:25px;
    border-radius:50%;
    background:rgba(255,255,255,.1);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:60px;
    backdrop-filter:blur(10px);
    animation:float 3s ease-in-out infinite;
}

h1{
    font-size:48px;
    margin-bottom:15px;
    font-weight:700;
}

p{
    font-size:20px;
    color:#cbd5e1;
    line-height:1.8;
    margin-bottom:35px;
}

.loader{
    width:250px;
    height:10px;
    background:rgba(255,255,255,.15);
    border-radius:20px;
    margin:auto;
    overflow:hidden;
}

.loader span{
    display:block;
    width:40%;
    height:100%;
    background:linear-gradient(90deg,#38bdf8,#22c55e);
    border-radius:20px;
    animation:loading 2s infinite;
}

.footer{
    margin-top:40px;
    color:#94a3b8;
    font-size:15px;
}

@keyframes loading{
    0%{
        transform:translateX(-120%);
    }
    100%{
        transform:translateX(350%);
    }
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-12px);
    }
}

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.05);
    animation:move 12s linear infinite;
}

.circle:nth-child(1){
    width:250px;
    height:250px;
    top:-100px;
    right:-100px;
}

.circle:nth-child(2){
    width:180px;
    height:180px;
    bottom:-80px;
    left:-80px;
}

@keyframes move{
    50%{
        transform:scale(1.2);
    }
}

@media(max-width:768px){
    h1{
        font-size:34px;
    }

    p{
        font-size:18px;
    }

    .logo{
        width:90px;
        height:90px;
        font-size:45px;
    }
}
</style>

</head>
<body>

<div class="circle"></div>
<div class="circle"></div>

<div class="container">

    <div class="logo">🚀</div>

    <h1>الموقع تحت الإنشاء</h1>

    <p>
        نعمل حالياً على تطوير الموقع وتجهيز تجربة مميزة لكم.
        سنعود قريباً بحلة جديدة وخدمات أفضل.
    </p>

    <div class="loader">
        <span></span>
    </div>

    <div class="footer">
        © 2026 جميع الحقوق محفوظة
    </div>

</div>

</body>
</html>
