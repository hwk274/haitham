<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>مولد الصور AI</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <h1>🎨 مولد الصور بالذكاء الاصطناعي</h1>

    <input id="prompt" placeholder="اكتب وصف الصورة">

    <select id="style">
        <option value="realistic">واقعي</option>
        <option value="anime">أنمي</option>
        <option value="3d">3D</option>
        <option value="cinematic">سينمائي</option>
    </select>

    <br><br>

    <button onclick="generate()">توليد الصورة</button>

    <br>

    <img id="output">

    <br>
    <a id="download" download="image.png">⬇ تحميل الصورة</a>

</div>

<script src="script.js"></script>

</body>
</html>
