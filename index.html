<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kids Learning PWA</title>

<link rel="manifest" href="manifest.json">

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#e3f2fd,#fce4ec);
direction:rtl;
text-align:center;
}

header{
background:#0d47a1;
color:#fff;
padding:15px;
font-size:20px;
font-weight:bold;
}

#bar{
display:flex;
justify-content:space-around;
padding:10px;
font-size:16px;
}

.card{
width:90%;
max-width:350px;
margin:15px auto;
background:white;
border-radius:20px;
padding:20px;
box-shadow:0 10px 20px rgba(0,0,0,0.15);
}

.animal{
font-size:70px;
margin:10px 0;
}

button{
padding:10px 15px;
margin:6px;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

.good{background:#4caf50;color:white;}
.bad{background:#f44336;color:white;}

#msg{
margin-top:10px;
font-weight:bold;
font-size:18px;
color:green;
}

#installBtn{
margin:10px;
background:#ffca28;
padding:10px;
border-radius:10px;
border:none;
}
</style>
</head>

<body>

<header>🎓 Kids Learning App</header>

<div id="bar">
<div>⭐ النقاط: <span id="score">0</span></div>
<div>🏆 المستوى: <span id="level">1</span></div>
</div>

<div class="card">

<div class="animal" id="animal">🐄</div>
<h2 id="name">البقرة</h2>

<button class="good" onclick="answer(true)">🐄 بقرة</button>
<button class="bad" onclick="answer(false)">🐴 حصان</button>
<button class="bad" onclick="answer(false)">🐦 طائر</button>

<div id="msg"></div>

</div>

<button onclick="next()">➡️ التالي</button>

<button id="installBtn" style="display:none">📲 تثبيت التطبيق</button>

<script src="app.js"></script>

<script>
if("serviceWorker" in navigator){
navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
