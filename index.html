<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>ألعاب الأطفال الذكية</title>

<style>
body {
    margin: 0;
    font-family: "Arial";
    background: linear-gradient(135deg, #e3f2fd, #fce4ec);
    text-align: center;
    direction: rtl;
}

header {
    background: #1976d2;
    color: white;
    padding: 20px;
    font-size: 26px;
    font-weight: bold;
}

.subtitle {
    margin: 10px;
    color: #444;
}

.game-area {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 25px;
    padding: 20px;
}

/* كروت الحيوانات */
.card {
    width: 220px;
    height: 260px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    position: relative;
    padding: 10px;
}

/* منطقة التركيب */
.dropzone {
    height: 140px;
    border: 3px dashed #bbb;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    background: #fafafa;
}

/* اسم الحيوان */
.animal-name {
    margin-top: 10px;
    font-size: 18px;
    font-weight: bold;
    color: #333;
}

/* الأجزاء */
.parts {
    margin-top: 20px;
}

.part {
    display: inline-block;
    padding: 12px 18px;
    margin: 10px;
    background: #ffca28;
    border-radius: 12px;
    cursor: grab;
    font-weight: bold;
    box-shadow: 0 5px 10px rgba(0,0,0,0.1);
    transition: 0.3s;
}

.part:hover {
    transform: scale(1.1);
}

/* رسالة */
#message {
    margin-top: 20px;
    font-size: 22px;
    font-weight: bold;
    color: green;
}

/* أنيميشن نجاح */
.success {
    animation: pop 0.5s ease;
}

@keyframes pop {
    0% { transform: scale(0.5); }
    100% { transform: scale(1); }
}
</style>
</head>

<body>

<header>🐾 ألعاب الأطفال الذكية - تركيب الحيوانات</header>
<div class="subtitle">اسحب الأجزاء وضعها في المكان الصحيح</div>

<div class="game-area">

    <!-- حصان -->
    <div class="card">
        <div class="dropzone" id="horseBox" ondrop="drop(event)" ondragover="allowDrop(event)">
            🐴
        </div>
        <div class="animal-name">الحصان</div>
    </div>

    <!-- بقرة -->
    <div class="card">
        <div class="dropzone" id="cowBox" ondrop="drop(event)" ondragover="allowDrop(event)">
            🐄
        </div>
        <div class="animal-name">البقرة</div>
    </div>

    <!-- طائر -->
    <div class="card">
        <div class="dropzone" id="birdBox" ondrop="drop(event)" ondragover="allowDrop(event)">
            🐦
        </div>
        <div class="animal-name">الطائر</div>
    </div>

</div>

<div class="parts">
    <div class="part" draggable="true" id="horse" ondragstart="drag(event)">رأس الحصان</div>
    <div class="part" draggable="true" id="cow" ondragstart="drag(event)">رأس البقرة</div>
    <div class="part" draggable="true" id="bird" ondragstart="drag(event)">جسم الطائر</div>
</div>

<div id="message"></div>

<script>
function allowDrop(ev) {
    ev.preventDefault();
}

function drag(ev) {
    ev.dataTransfer.setData("text", ev.target.id);
}

function drop(ev) {
    ev.preventDefault();

    let data = ev.dataTransfer.getData("text");
    let item = document.getElementById(data);

    if (
        (data === "horse" && ev.target.id === "horseBox") ||
        (data === "cow" && ev.target.id === "cowBox") ||
        (data === "bird" && ev.target.id === "birdBox")
    ) {
        ev.target.appendChild(item);
        ev.target.classList.add("success");
        document.getElementById("message").innerText = "🎉 ممتاز! أحسنت يا بطل!";
    } else {
        document.getElementById("message").innerText = "❌ حاول مرة أخرى";
    }
}
</script>

</body>
</html>
