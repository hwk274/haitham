<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SiteBuilder</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#0f172a;
color:white;
}

.container{
width:90%;
max-width:1300px;
margin:auto;
}

header{
background:#111827;
padding:20px;
position:sticky;
top:0;
z-index:1000;
}

#siteName{
font-size:28px;
font-weight:900;
color:#38bdf8;
}

.hero{
padding:120px 20px;
text-align:center;
background:linear-gradient(135deg,#0f172a,#1e293b);
}

.hero h1{
font-size:60px;
margin-bottom:20px;
}

.hero p{
font-size:22px;
max-width:800px;
margin:auto;
color:#cbd5e1;
}

.section{
padding:80px 0;
}

.section-title{
text-align:center;
font-size:40px;
margin-bottom:50px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

.card{
background:#1e293b;
border-radius:20px;
overflow:hidden;
transition:.3s;
}

.card:hover{
transform:translateY(-10px);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.content{
padding:20px;
}

.content h3{
margin-bottom:10px;
}

.plan{
background:#1e293b;
padding:40px;
border-radius:20px;
text-align:center;
}

.price{
font-size:40px;
font-weight:900;
color:#38bdf8;
margin-top:15px;
}

.contact{
background:#111827;
padding:80px 20px;
text-align:center;
}

.contact h2{
margin-bottom:25px;
}

.contact p{
font-size:22px;
line-height:2;
}

footer{
padding:30px;
text-align:center;
background:#0b1220;
color:#94a3b8;
}

@media(max-width:768px){

.hero h1{
font-size:36px;
}

.hero p{
font-size:18px;
}

.section-title{
font-size:28px;
}

}

</style>

</head>
<body>

<header>
<div class="container">
<div id="siteName">SiteBuilder</div>
</div>
</header>

<section class="hero">
<div class="container">

<h1 id="heroTitle"></h1>

<p id="heroDescription"></p>

</div>
</section>

<section class="section">

<div class="container">

<h2 class="section-title">مميزات المنصة</h2>

<div class="grid" id="features"></div>

</div>

</section>

<section class="section">

<div class="container">

<h2 class="section-title">القوالب الجاهزة</h2>

<div class="grid" id="templates"></div>

</div>

</section>

<section class="section">

<div class="container">

<h2 class="section-title">الباقات</h2>

<div class="grid" id="plans"></div>

</div>

</section>

<section class="contact">

<h2>تواصل معنا</h2>

<p>
📞 <span id="phone"></span>
</p>

<p>
📧 <span id="email"></span>
</p>

</section>

<footer>
© 2026 SiteBuilder - جميع الحقوق محفوظة
</footer>

<script src="app.js"></script>

</body>
</html>
