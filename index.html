<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎓 تخرج جنى إسلام</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Cairo',sans-serif;
background:linear-gradient(135deg,#ffe6f0,#e6f7ff,#fff7cc);
overflow:hidden;
}

.container{
text-align:center;
padding:40px 20px;
position:relative;
z-index:2;
}

h1{
font-size:52px;
color:#ff3d7f;
margin-bottom:10px;
text-shadow:0 5px 20px rgba(0,0,0,0.15);
}

h2{
font-size:30px;
color:#333;
margin-bottom:20px;
}

.badge{
display:inline-block;
padding:10px 25px;
background:#fff;
border-radius:50px;
font-weight:900;
color:#ff3d7f;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
margin-bottom:20px;
}

.card{
background:white;
display:inline-block;
padding:30px;
border-radius:30px;
box-shadow:0 20px 60px rgba(0,0,0,0.15);
max-width:500px;
}

.card p{
font-size:20px;
color:#555;
line-height:1.8;
}

.photo{
width:140px;
height:140px;
border-radius:50%;
background:linear-gradient(135deg,#ffb3d9,#ffd6e7);
margin:0 auto 20px;
display:flex;
align-items:center;
justify-content:center;
font-size:60px;
}

.btn{
margin-top:20px;
display:inline-block;
padding:12px 30px;
background:linear-gradient(135deg,#ff3d7f,#ff7aa8);
color:white;
border-radius:50px;
text-decoration:none;
font-weight:900;
transition:0.3s;
}

.btn:hover{
transform:scale(1.05);
}

/* نجوم متحركة */
.star{
position:absolute;
width:10px;
height:10px;
background:white;
border-radius:50%;
animation:float 6s infinite ease-in-out;
opacity:0.8;
}

@keyframes float{
0%{transform:translateY(0);opacity:0;}
50%{opacity:1;}
100%{transform:translateY(-900px);opacity:0;}
}

/* بالونات */
.balloon{
position:absolute;
width:40px;
height:50px;
border-radius:50%;
animation:rise 10s infinite linear;
bottom:-100px;
}

.balloon:nth-child(1){left:10%;background:#ff4d6d;}
.balloon:nth-child(2){left:30%;background:#4dd2ff;}
.balloon:nth-child(3){left:50%;background:#ffd24d;}
.balloon:nth-child(4){left:70%;background:#7cff4d;}

@keyframes rise{
0%{transform:translateY(0);}
100%{transform:translateY(-1200px);}
}

.footer{
margin-top:30px;
color:#777;
}

</style>
</head>

<body>

<!-- بالونات -->
<div class="balloon"></div>
<div class="balloon"></div>
<div class="balloon"></div>
<div class="balloon"></div>

<!-- نجوم -->
<script>
for(let i=0;i<40;i++){
let star=document.createElement("div");
star.className="star";
star.style.left=Math.random()*100+"%";
star.style.top=Math.random()*100+"%";
star.style.animationDuration=(Math.random()*5+3)+"s";
document.body.appendChild(star);
}
</script>

<div class="container">

<div class="badge">🎓 تخرج من الحضانة</div>

<h1>جنى إسلام</h1>

<h2>مبروك يا أميرة المستقبل 🎉</h2>

<div class="card">

<div class="photo">👧</div>

<p>
نبارك للطفلة الجميلة <b>جنى إسلام</b> تخرجها من مرحلة الحضانة 🎓✨  
ونسأل الله لها التوفيق والنجاح في مراحلها القادمة  
لتكون من المتفوقات دائمًا 🌸💖
</p>

<a class="btn" href="#" onclick="alert('🎉 مبروك جنى إسلام 🎉')">
اضغط للتهنئة
</a>

</div>

<div class="footer">
💖 تصميم احتفالي خاص بالتخرج 💖
</div>

</div>

</body>
</html>
