<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>ألعاب الأطفال - تجميع الأشكال</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #f0f9ff, #e0f7fa);
    text-align: center;
    direction: rtl;
}

h1 {
    color: #0d47a1;
}

.container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 30px;
    margin-top: 30px;
}

.box {
    width: 200px;
    height: 200px;
    border: 2px dashed #aaa;
    border-radius: 15px;
    position: relative;
    background: #fff;
}

.part {
    width: 60px;
    height: 60px;
    background: #4caf50;
    margin: 10px;
    border-radius: 10px;
    cursor: grab;
    display: inline-block;
}

.parts {
    margin-top: 20px;
}

#message {
    margin-top: 20px;
    font-size: 22px;
    color: green;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>🎮 ألعاب الأطفال - تجميع الحيوانات</h1>
<p>اسحب الأجزاء وضعها في المكان الصحيح</p>

<div class="container">

    <!-- صندوق الحيوان -->
    <div class="box" id="box1" ondrop="drop(event)" ondragover="allowDrop(event)">
        🐴 حصان
    </div>

    <div class="box" id="box2" ondrop="drop(event)" ondragover="allowDrop(event)">
        🐄 بقرة
    </div>

    <div class="box" id="box3" ondrop="drop(event)" ondragover="allowDrop(event)">
        🐦 طائر
    </div>

</div>

<div class="parts">
    <div class="part" draggable="true" id="horse" ondragstart="drag(event)">رأس الحصان</div>
    <div class="part" draggable="true" id="cow" ondragstart="drag(event)">رأس البقرة</div>
    <div class="part" draggable="true" id="bird" ondragstart="drag(event)">جسم الطائر</div>
</div>

<div id="message"></div>

<script>
function allowDrop(ev) {
    ev.preventDefault();
}

function drag(ev) {
    ev.dataTransfer.setData("text", ev.target.id);
}

function drop(ev) {
    ev.preventDefault();
    var data = ev.dataTransfer.getData("text");
    var item = document.getElementById(data);

    if (
        (data === "horse" && ev.target.id === "box1") ||
        (data === "cow" && ev.target.id === "box2") ||
        (data === "bird" && ev.target.id === "box3")
    ) {
        ev.target.appendChild(item);
        document.getElementById("message").innerText = "🎉 ممتاز! أحسنت!";
    } else {
        document.getElementById("message").innerText = "❌ حاول مرة أخرى";
    }
}
</script>

</body>
</html>
