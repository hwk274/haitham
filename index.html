<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تطبيق تعليم الأطفال</title>

<link rel="manifest" href="manifest.json">

<style>
body {
    margin:0;
    font-family: Arial;
    background: linear-gradient(135deg,#e3f2fd,#fce4ec);
    text-align:center;
    direction:rtl;
}

header {
    background:#0d47a1;
    color:white;
    padding:15px;
    font-size:22px;
}

/* لوحة النقاط */
#topBar {
    display:flex;
    justify-content:space-around;
    padding:10px;
    font-size:18px;
}

/* كروت */
.card {
    width:90%;
    max-width:350px;
    margin:15px auto;
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.animal {
    font-size:60px;
}

button {
    padding:10px 15px;
    margin:8px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

.correct { background:#4caf50; color:white; }
.wrong { background:#f44336; color:white; }

#msg {
    font-size:18px;
    margin:10px;
    color:green;
}
</style>
</head>

<body>

<header>🎓 تطبيق تعليم الأطفال الذكي</header>

<div id="topBar">
    <div>⭐ النقاط: <span id="score">0</span></div>
    <div>🏆 المستوى: <span id="level">1</span></div>
</div>

<div class="card">
    <div class="animal" id="animal">🐄</div>
    <h2 id="name">البقرة</h2>

    <button class="correct" onclick="answer(true)">🐄 بقرة</button>
    <button class="wrong" onclick="answer(false)">🐴 حصان</button>
    <button class="wrong" onclick="answer(false)">🐦 طائر</button>

    <div id="msg"></div>
</div>

<button onclick="next()">➡️ التالي</button>

<script src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
