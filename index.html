<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة الأطفال</title>

<link rel="manifest" href="manifest.json">

<style>
body {
    margin:0;
    font-family: Arial;
    background: linear-gradient(135deg,#e3f2fd,#fce4ec);
    text-align:center;
    direction:rtl;
}

header {
    background:#0d47a1;
    color:white;
    padding:15px;
    font-size:22px;
}

.card {
    width:90%;
    max-width:300px;
    margin:20px auto;
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.dropzone {
    height:180px;
    border:3px dashed #aaa;
    border-radius:15px;
    font-size:60px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.part {
    display:inline-block;
    background:#ffca28;
    padding:10px;
    margin:10px;
    border-radius:10px;
    cursor:grab;
}

#msg {
    margin-top:10px;
    font-size:18px;
    font-weight:bold;
    color:green;
}
</style>
</head>

<body>

<header>🎮 تطبيق ألعاب الأطفال</header>

<div class="card">
    <div class="dropzone" id="box" ondrop="drop(event)" ondragover="allow(event)">🐴</div>
    <p>الحصان</p>
</div>

<div>
    <div class="part" draggable="true" id="horse" ondragstart="drag(event)">رأس حصان</div>
</div>

<div id="msg"></div>

<script>
function allow(ev){ ev.preventDefault(); }

function drag(ev){
    ev.dataTransfer.setData("text", ev.target.id);
}

function drop(ev){
    ev.preventDefault();
    let data = ev.dataTransfer.getData("text");

    if(data === "horse"){
        ev.target.appendChild(document.getElementById(data));
        document.getElementById("msg").innerText = "🎉 ممتاز!";
    } else {
        document.getElementById("msg").innerText = "❌ حاول مرة أخرى";
    }
}

/* تسجيل Service Worker */
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
