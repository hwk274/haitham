<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>البث التلفزيوني المباشر</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #0f172a;
      color: #fff;
    }
    header {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    header h1 {
      margin: 0;
      font-size: 26px;
    }
    header p {
      margin: 8px 0 0;
      color: #cbd5e1;
      font-size: 14px;
    }
    .container {
      display: grid;
      grid-template-columns: 1.4fr 0.8fr;
      gap: 20px;
      padding: 20px;
    }
    .player-card, .channels-card {
      background: #111827;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .player-header, .channels-header {
      padding: 16px 18px;
      background: #1f2937;
      font-size: 18px;
      font-weight: bold;
    }
    .video-wrap {
      background: #000;
      aspect-ratio: 16 / 9;
      width: 100%;
    }
    video {
      width: 100%;
      height: 100%;
      background: #000;
    }
    .channel-info {
      padding: 14px 18px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .channel-info h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    .channel-info p {
      margin: 0;
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.7;
    }
    .search-box {
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: #0f172a;
    }
    .search-box input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: none;
      outline: none;
      background: #1e293b;
      color: #fff;
      font-size: 14px;
    }
    .channel-list {
      max-height: 70vh;
      overflow-y: auto;
      padding: 12px;
    }
    .channel-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #0f172a;
      margin-bottom: 10px;
      padding: 12px;
      border-radius: 14px;
      cursor: pointer;
      transition: 0.2s ease;
      border: 1px solid transparent;
    }
    .channel-item:hover {
      background: #1e293b;
      border-color: rgba(255,255,255,0.08);
    }
    .channel-item.active {
      background: #1d4ed8;
      border-color: #60a5fa;
    }
    .channel-logo {
      width: 55px;
      height: 55px;
      border-radius: 12px;
      object-fit: cover;
      background: #fff;
      padding: 4px;
    }
    .channel-text {
      flex: 1;
    }
    .channel-text h3 {
      margin: 0 0 5px;
      font-size: 16px;
    }
    .channel-text span {
      color: #cbd5e1;
      font-size: 13px;
    }
    .note {
      margin: 0;
      padding: 12px 18px 18px;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.7;
    }
    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
      .channel-list {
        max-height: 400px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>البث التلفزيوني المباشر</h1>
    <p>صفحة عرض للقنوات المصرح بها - متوافقة مع الجوال والكمبيوتر</p>
  </header>

  <div class="container">
    <div class="player-card">
      <div class="player-header">المشغل</div>
      <div class="video-wrap">
        <video id="video" controls autoplay></video>
      </div>
      <div class="channel-info">
        <h2 id="channelName">اختر قناة من القائمة</h2>
        <p id="channelDesc">سيتم عرض اسم القناة والوصف هنا بعد الاختيار.</p>
      </div>
    </div>

    <div class="channels-card">
      <div class="channels-header">القنوات</div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="ابحث عن قناة..." />
      </div>
      <div class="channel-list" id="channelList"></div>
      <p class="note">
        ملاحظة: أضف فقط روابط البث الرسمية أو المصرح باستخدامها بصيغة HLS مثل M3U8.
      </p>
    </div>
  </div>

  <script>
    const channels = [
      {
        name: "القناة الأولى",
        description: "وصف مختصر للقناة الأولى",
        logo: "https://via.placeholder.com/80x80.png?text=TV1",
        url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
      },
      {
        name: "القناة الثانية",
        description: "وصف مختصر للقناة الثانية",
        logo: "https://via.placeholder.com/80x80.png?text=TV2",
        url: "https://test-streams.mux.dev/test_001/stream.m3u8"
      },
      {
        name: "قناة الأخبار",
        description: "قناة للأخبار والبرامج المباشرة",
        logo: "https://via.placeholder.com/80x80.png?text=NEWS",
        url: "https://mojen-apis.livebox.co.in/livebox/ngrp:news18hindustan/master.m3u8"
      }
    ];

    const video = document.getElementById('video');
    const channelList = document.getElementById('channelList');
    const channelName = document.getElementById('channelName');
    const channelDesc = document.getElementById('channelDesc');
    const searchInput = document.getElementById('searchInput');
    let hls;

    function loadChannel(channel, clickedElement = null) {
      channelName.textContent = channel.name;
      channelDesc.textContent = channel.description;

      if (hls) {
        hls.destroy();
      }

      if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(channel.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          video.play().catch(() => {});
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = channel.url;
        video.addEventListener('loadedmetadata', function () {
          video.play().catch(() => {});
        });
      } else {
        alert('المتصفح لا يدعم تشغيل هذا النوع من البث.');
      }

      document.querySelectorAll('.channel-item').forEach(item => item.classList.remove('active'));
      if (clickedElement) clickedElement.classList.add('active');
    }

    function renderChannels(filter = '') {
      channelList.innerHTML = '';
      const filtered = channels.filter(ch =>
        ch.name.toLowerCase().includes(filter.toLowerCase()) ||
        ch.description.toLowerCase().includes(filter.toLowerCase())
      );

      filtered.forEach((channel, index) => {
        const item = document.createElement('div');
        item.className = 'channel-item';
        item.innerHTML = `
          <img class="channel-logo" src="${channel.logo}" alt="${channel.name}">
          <div class="channel-text">
            <h3>${channel.name}</h3>
            <span>${channel.description}</span>
          </div>
        `;
        item.addEventListener('click', () => loadChannel(channel, item));
        channelList.appendChild(item);

        if (index === 0 && !filter) {
          setTimeout(() => loadChannel(channel, item), 200);
        }
      });
    }

    searchInput.addEventListener('input', function () {
      renderChannels(this.value);
    });

    renderChannels();
  </script>

</body>
</html>
